[project]
name = "memex"
version = "0.3.0"
description = "Source-grounded domain wikis authored with Hermes or Codex."
readme = "README.md"
requires-python = ">=3.11"

[dependency-groups]
dev = [
    "pytest>=9,<10",
    "ruff>=0.15.20",
]

[tool.pytest]
minversion = "9.0"
addopts = ["-ra"]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["scripts", "tests"]

[tool.ruff.lint]
select = ["B", "E4", "E7", "E9", "F", "I"]
