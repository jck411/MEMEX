name: memex

services:
  couchdb:
    image: couchdb:3.5.2
    restart: unless-stopped
    env_file: .env
    environment:
      COUCHDB_USER: ${COUCHDB_USER}
      COUCHDB_PASSWORD: ${COUCHDB_PASSWORD}
    ports:
      - "5984:5984"
    volumes:
      - /srv/memex/couchdb:/opt/couchdb/data
      - /srv/memex/couchdb-config:/opt/couchdb/etc/local.d
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --user "$${COUCHDB_USER}:$${COUCHDB_PASSWORD}"
          http://127.0.0.1:5984/_up | grep --quiet '"status":"ok"'
      start_period: 30s
      interval: 30s
      timeout: 10s
      retries: 5

  livesync:
    image: ghcr.io/vrtmrz/livesync-cli:1.0.15-cli
    restart: unless-stopped
    depends_on:
      couchdb:
        condition: service_healthy
    command:
      - --settings
      - /config/settings.json
      - --vault
      - /vault
      - daemon
    volumes:
      - /srv/memex/livesync:/data
      - /srv/memex/vault:/vault
      - /srv/memex/livesync-config:/config

  mcp:
    build:
      context: ..
      dockerfile: deploy/mcp.Dockerfile
    image: memex-mcp:local
    restart: unless-stopped
    env_file: .env
    environment:
      MEMEX_VAULT_ROOT: /vault
      MEMEX_MCP_HOST: 0.0.0.0
      MEMEX_MCP_PORT: "9020"
      MEMEX_MCP_FORWARDED_ALLOW_IPS: "*"
    ports:
      - "9020:9020"
    volumes:
      - /srv/memex/vault:/vault:ro
    healthcheck:
      test:
        - CMD
        - /app/.venv/bin/python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:9020/health', timeout=5).read()
      start_period: 10s
      interval: 30s
      timeout: 10s
      retries: 3
